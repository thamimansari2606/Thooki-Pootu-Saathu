# Render Blueprint for the game server (free plan).
services:
  - type: web
    name: thooki-pootu-saathu-server
    runtime: node
    rootDir: server
    plan: free
    region: singapore
    buildCommand: npm install
    startCommand: node --experimental-strip-types src/index.ts
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: ALLOWED_ORIGINS
        sync: false
      - key: DATA_FILE
        value: ./data/store.json
      - key: TIME_SCALE
        value: "1"
