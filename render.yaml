# Render Blueprint for the game server (persistent WebSocket connections need a web service, not serverless).
services:
  - type: web
    name: thooki-pootu-saathu-server
    runtime: node
    rootDir: server
    plan: starter
    buildCommand: npm install
    startCommand: node --experimental-strip-types src/index.ts
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: ALLOWED_ORIGINS
        sync: false          # set to your Vercel URL, e.g. https://thooki.vercel.app (comma-separated)
      - key: DATA_FILE
        value: /var/data/store.json
      - key: TIME_SCALE
        value: "1"
    disk:
      name: game-data
      mountPath: /var/data
      sizeGB: 1
